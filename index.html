<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Trotti Tuner Pro</title>
    <meta name="description" content="E-Trotti Tuning & Cockpit App with dynamic radial gauge charts, live telemetry, and model-specific tuning options.">
    <meta property="og:title" content="E-Trotti Tuner Pro">
    <meta property="og:description" content="E-Trotti Tuning & Cockpit App with dynamic radial gauge charts, live telemetry, and model-specific tuning options.">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-accent {
            color: #22c55e;
            text-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
        }
        .btn-neon {
            background: #22c55e;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
            transition: all 0.3s ease;
        }
        .btn-neon:hover {
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.6);
            transform: translateY(-1px);
        }
    </style>
    <link rel="stylesheet" href="/index.css">

    <div id="root"></div>
